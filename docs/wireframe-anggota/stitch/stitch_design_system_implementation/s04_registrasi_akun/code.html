  </head><body class="bg-surface-canvas text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface-canvas"><div class="flex flex-col w-full pb-8">
<!-- Top App Bar (56px) -->
<header class="w-full h-14 bg-surface-panel flex items-center justify-between px-4 sticky top-0 z-30 shadow-sm">
<div class="flex items-center gap-3">
<button aria-label="Kembali" class="w-10 h-10 -ml-2 flex items-center justify-center text-text-primary active:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-title-md text-title-md text-text-primary tracking-tight">Daftar Akun</h1>
</div>
<div class="flex items-center gap-1.5">
<span class="font-label-sm text-label-sm text-text-secondary px-2 py-0.5 bg-surface-canvas">MODUL 04</span>
</div>
</header>
<!-- Main Content Form Area -->
<div class="w-full px-4 pt-4 flex flex-col gap-5">
<!-- 1. Banner Info (Biru Kiosk Verification Alert) -->
<section class="w-full bg-status-info-bg p-3 flex items-start gap-3 shadow-sm" style="border: 1px solid #BBDEFB; border-radius: 8px;">
<span class="material-symbols-outlined text-status-info-text text-[20px] shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-sm text-body-sm text-status-info-text leading-tight">
        Pendaftaran akan diverifikasi petugas. Nomor anggota diterbitkan setelah pendaftaran disetujui.
      </p>
</section>
<!-- 2. Form Fields Container -->
<form class="w-full flex flex-col gap-4 bg-surface-panel p-4 shadow-sm" onsubmit="event.preventDefault();" style="border: 1px solid #E0E3E8;">
<!-- Nama Lengkap -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-text-primary flex items-center justify-between" for="reg-name">
<span>Nama Lengkap <span class="text-error">*</span></span>
<span class="font-label-sm text-label-sm text-text-secondary">Sesuai KTP/Kartu Pelajar</span>
</label>
<div class="relative w-full">
<input class="w-full h-12 px-3 bg-surface-panel font-body-md text-body-md text-text-primary placeholder:text-text-secondary outline-none focus:ring-1 focus:ring-primary transition-all" id="reg-name" name="fullname" placeholder="cth. Rina Maharani" style="border: 1px solid #E0E3E8; border-radius: 8px;" type="text"/>
</div>
</div>
<!-- Alamat -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-text-primary" for="reg-address">
          Alamat Tinggal <span class="text-error">*</span>
</label>
<textarea class="w-full p-3 bg-surface-panel font-body-md text-body-md text-text-primary placeholder:text-text-secondary outline-none focus:ring-1 focus:ring-primary transition-all resize-none" id="reg-address" name="address" placeholder="cth. Jl. Melati No. 12, Bandung" rows="3" style="border: 1px solid #E0E3E8; border-radius: 8px;"></textarea>
</div>
<!-- Nomor Telepon -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-text-primary flex items-center justify-between" for="reg-phone">
<span>Nomor Telepon <span class="text-error">*</span></span>
<span class="font-label-sm text-label-sm text-text-secondary">WhatsApp Aktif</span>
</label>
<div class="relative w-full flex items-center">
<span class="absolute left-3 font-label-md text-label-md text-text-secondary pointer-events-none select-none">+62</span>
<input class="w-full h-12 pl-12 pr-3 bg-surface-panel font-body-md text-body-md text-text-primary placeholder:text-text-secondary outline-none focus:ring-1 focus:ring-primary transition-all" id="reg-phone" name="phone" placeholder="cth. 0812-3456-7890" style="border: 1px solid #E0E3E8; border-radius: 8px;" type="tel"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-text-primary" for="reg-email">
          Email <span class="text-error">*</span>
</label>
<input class="w-full h-12 px-3 bg-surface-panel font-body-md text-body-md text-text-primary placeholder:text-text-secondary outline-none focus:ring-1 focus:ring-primary transition-all" id="reg-email" name="email" placeholder="cth. rina.maharani@email.com" style="border: 1px solid #E0E3E8; border-radius: 8px;" type="email"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-text-primary" for="reg-pass">
          Password <span class="text-error">*</span>
</label>
<div class="relative w-full flex items-center">
<input class="w-full h-12 pl-3 pr-11 bg-surface-panel font-body-md text-body-md text-text-primary placeholder:text-text-secondary outline-none focus:ring-1 focus:ring-primary transition-all" id="reg-pass" name="password" placeholder="Masukkan kata sandi baru" style="border: 1px solid #E0E3E8; border-radius: 8px;" type="password"/>
<button aria-label="Tampilkan atau sembunyikan password" class="absolute right-1.5 w-9 h-9 flex items-center justify-center text-text-secondary active:text-text-primary" id="toggle-pass" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-text-secondary mt-0.5">
          Minimal 8 karakter, kombinasi huruf dan angka
        </p>
</div>
<!-- Konfirmasi Password -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-text-primary" for="reg-pass-confirm">
          Konfirmasi Password <span class="text-error">*</span>
</label>
<div class="relative w-full flex items-center">
<input class="w-full h-12 pl-3 pr-11 bg-surface-panel font-body-md text-body-md text-text-primary placeholder:text-text-secondary outline-none focus:ring-1 focus:ring-primary transition-all" id="reg-pass-confirm" name="password_confirm" placeholder="Ulangi kata sandi" style="border: 1px solid #E0E3E8; border-radius: 8px;" type="password"/>
<button aria-label="Tampilkan atau sembunyikan konfirmasi password" class="absolute right-1.5 w-9 h-9 flex items-center justify-center text-text-secondary active:text-text-primary" id="toggle-confirm" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- 3. Checkbox Ketentuan -->
<div class="pt-2">
<label class="flex items-start gap-3 cursor-pointer select-none group">
<div class="relative flex items-center justify-center shrink-0 mt-0.5">
<input class="peer sr-only" id="terms-checkbox" type="checkbox"/>
<div class="w-5 h-5 bg-surface-panel flex items-center justify-center peer-checked:bg-primary-container peer-checked:border-primary-container transition-all" style="border: 1.5px solid #5F6675; border-radius: 4px;">
<span class="material-symbols-outlined text-white text-[16px] hidden peer-checked:block font-bold">
                check
              </span>
</div>
</div>
<span class="font-body-sm text-body-sm text-text-primary leading-tight">
            Saya menyetujui <span class="underline font-label-md text-primary-container cursor-pointer">ketentuan perpustakaan</span>
</span>
</label>
</div>
<!-- 4. Tombol Utama & Tautan -->
<div class="pt-3 flex flex-col gap-4 items-center">
<button class="w-full h-12 text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 active:opacity-95 transition-opacity" id="btn-submit" style="background-color: #3949AB; border-radius: 12px;" type="submit">
<span>Kirim Pendaftaran</span>
<span class="material-symbols-outlined text-[18px]">how_to_reg</span>
</button>
<p class="font-body-md text-body-md text-text-secondary text-center">
          Sudah punya akun? 
          <a class="font-label-lg text-label-lg underline active:opacity-80" href="#" style="color: #3949AB;">
            Masuk
          </a>
</p>
</div>
</form>
<!-- Visual Footer Institutional Tagline -->
<div class="w-full flex items-center justify-center gap-2 py-2 text-text-secondary opacity-70">
<span class="material-symbols-outlined text-[16px]">menu_book</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Libro Space Terminal • Terkoneksi Kiosk</span>
</div>
</div>
</div>
<script>
  (function() {
    // Password Visibility Toggle Interaction
    function setupPasswordToggle(buttonId, inputId) {
      const btn = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      if (!btn || !input) return;

      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const icon = btn.querySelector('.material-symbols-outlined');
        if (input.type === 'password') {
          input.type = 'text';
          if (icon) icon.textContent = 'visibility_off';
        } else {
          input.type = 'password';
          if (icon) icon.textContent = 'visibility';
        }
      });
    }

    setupPasswordToggle('toggle-pass', 'reg-pass');
    setupPasswordToggle('toggle-confirm', 'reg-pass-confirm');
  })();
</script></main></body></html>
